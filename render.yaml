# render.yaml — Render 自动部署配置
# 文档：https://render.com/docs/yaml-spec

services:
  - type: web
    name: travel-plan
    env: node
    region: singapore          # 离中国较近，延迟低
    plan: free

    # 构建
    buildCommand: npm install && npm run build
    startCommand: npm start

    # 环境变量
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /var/data
      - key: RENDER_DISK_MOUNT_PATH
        value: /var/data

    # 自动部署：push 到 main 即自动重新部署
    autoDeploy: true

# ⚠️  注意：Render 免费版磁盘不持久，重启/睡醒后数据会丢失
# 如需持久存储，可升级到 Render 付费计划（$7/月起）或改用 Supabase PostgreSQL
